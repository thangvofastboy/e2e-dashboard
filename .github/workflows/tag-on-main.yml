# When main moves (a merged PR or a pushed release), make sure the version in
# .claude-plugin/plugin.json has its vX.Y.Z tag: `/e2e-dashboard update` follows tags.
name: tag-on-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tag the manifest version if it is new
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="v$version"
          # `/e2e-dashboard update` installs what marketplace.json points at: a tag it does not
          # point at would announce an update that installs nothing (use `npm run release`).
          ref=$(node -p "(require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'e2e-dashboard').source || {}).ref || ''")
          if [ "$ref" != "$tag" ]; then
            echo "marketplace.json points at '$ref', not $tag — not tagging (run npm run release)"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi
